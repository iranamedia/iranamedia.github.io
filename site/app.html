<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رسانه ایرانا</title>
<meta name="description" content="تازه‌ترین رویدادهای ایران، شبانروزی سر هر ساعت کشور">
<meta name="theme-color" content="#0a1530">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ایرانا">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="رسانه ایرانا">
<meta property="og:description" content="تازه‌ترین رویدادهای ایران، شبانروزی سر هر ساعت کشور">
<meta property="og:image" content="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Vazirmatn:wght@400;700;800;900&display=swap">
<link rel="stylesheet" href="irana.css">
<style>
  body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
  .player { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px; padding: 18px 20px;
    border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(160deg, rgba(26,49,114,.8), rgba(10,21,48,.65));
    box-shadow: inset 0 1px 0 rgba(224,180,82,.25), 0 18px 50px rgba(0,0,0,.35); }
  .play { width: 64px; height: 64px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
    background: linear-gradient(180deg, #f3d17e, var(--gold) 55%, var(--gold-deep)); color: #1b1404; box-shadow: 0 8px 26px rgba(224,180,82,.35); }
  .play svg { width: 28px; height: 28px; fill: currentColor; }
  .play .i-pause { display: none; } .player.on .i-play { display: none; } .player.on .i-pause { display: block; }
  .p-info { min-width: 0; display: grid; gap: 6px; }
  .p-title { font-weight: 800; color: var(--ivory); line-height: 1.6; }
  .p-sub { color: var(--mist); font-size: .88rem; line-height: 1.5; }
  .bar { position: relative; height: 6px; border-radius: 99px; background: rgba(255,255,255,.1); cursor: pointer; direction: ltr; }
  .bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); }
  .times { display: flex; justify-content: space-between; color: var(--mist); font-size: .8rem; font-variant-numeric: tabular-nums; direction: ltr; }
  .install { display: none; text-align: center; color: var(--mist); font-size: .9rem; border: 1px dashed var(--line); border-radius: 12px; padding: 12px 16px; }
  .install.show { display: block; }
  .status { text-align: center; color: var(--mist); }
</style>
</head>
<body>
<div class="wrap">
  <header class="crown">
    <img class="seal" src="logo.jpg" alt="نشان ایرانا" width="132" height="132">
    <h1>رسانه ایرانا</h1>
    <span class="roman" lang="en">IRANAMEDIA</span>
    <div class="ornament"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/></svg></div>
    <p class="tagline">تازه‌ترین رویدادهای ایران</p>
    <p class="cadence">شبانروزی سر هر ساعت کشور</p>
  </header>

  <div class="player" id="player">
    <button class="play" id="play" type="button" aria-label="پخش برنامهٔ این ساعت">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15L19 12z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <div class="p-info">
      <div class="p-title">رادیو ایرانا · برنامهٔ این ساعت</div>
      <div class="p-sub" id="pSub">در حال دریافت…</div>
      <div class="bar" id="bar"><i id="fill"></i></div>
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    </div>
    <audio id="audio" preload="none"></audio>
  </div>

  <div class="actions">
    <a class="btn" href="https://t.me/IranaMediaNews"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 3.5 2.8 10.7c-1 .4-1 1.6.1 1.9l4.7 1.5 1.8 5.6c.3.8 1.3 1 1.9.4l2.6-2.5 4.9 3.6c.7.5 1.7.1 1.9-.8l3-15.2c.2-1-.8-1.8-1.7-1.4zM9.6 14.3l8.2-7.4-6.9 8.7-.3 3.2z"/></svg>کانال تلگرام</a>
    <button class="btn" id="installBtn" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3h2v10l3.5-3.5 1.4 1.4L12 16.8 6.1 10.9l1.4-1.4L11 13zM5 19h14v2H5z"/></svg>نصب اپ ایرانا</button>
  </div>
  <p class="install" id="iosHint">برای نصب در آیفون: دکمهٔ هم‌رسانی <b>⬆︎</b> را بزنید و «Add to Home Screen» را برگزینید.</p>

  <div class="stamp" id="stamp" hidden></div>
  <section id="news"><p class="status">در حال دریافت تازه‌ترین خبرها…</p></section>
</div>
<script src="app.js"></script>
</body>
</html>
