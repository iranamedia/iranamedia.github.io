name: بازبینی فیسبوک (تنها خواندن)
on:
  workflow_dispatch:
    inputs:
      video:
        description: "شماره‌ی ویدیوی فیسبوک"
        default: "1821227112108432"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: نگریستن
        env:
          PAGE: ${{ secrets.META_PAGE_ID }}
          TOK: ${{ secrets.META_PAGE_TOKEN }}
          VID: ${{ inputs.video }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          G = "https://graph.facebook.com/v23.0"
          tok, page, vid = os.environ["TOK"], os.environ["PAGE"], os.environ["VID"]
          def get(path, **q):
              q["access_token"] = tok
              try:
                  with urllib.request.urlopen(f"{G}/{path}?" + urllib.parse.urlencode(q), timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  return {"error": e.read().decode()[:400]}
          pt = get(page, fields="access_token").get("access_token") or tok
          tok2 = tok; tok = pt
          print("PAGE:", json.dumps(get(page, fields="id,name,link,followers_count,is_published,verification_status"), ensure_ascii=False))
          print("ME:", json.dumps(get("me", fields="id,name"), ensure_ascii=False))
          print("VIDEO:", json.dumps(get(vid, fields="id,title,published,status,permalink_url,from,created_time,privacy"), ensure_ascii=False))
          print("RECENT VIDEOS:", json.dumps(get(f"{page}/videos", fields="id,title,published,created_time,permalink_url", limit=5), ensure_ascii=False)[:1500])
          print("FEED:", json.dumps(get(f"{page}/feed", fields="id,created_time,message,permalink_url", limit=5), ensure_ascii=False)[:1500])
          PY
