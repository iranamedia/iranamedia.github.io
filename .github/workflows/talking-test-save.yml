name: آزمایش گوینده‌ی گویا — نگه‌داری نتیجه در شاخه‌ی talking-test
# ویدیوی آزمایش را از Artifacts یک اجرا برمی‌دارد و در شاخه‌ی جداگانه‌ی talking-test می‌گذارد (نه در main، نه در تارنما).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "شماره‌ی اجرای آزمایش"
        required: true
      artifact:
        description: "نام Artifact"
        default: talking-test
permissions:
  contents: write
  actions: read
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: out
      - run: |
          cd out && git init -q && git checkout -q -b talking-test
          git add -A && git -c user.name=irana-bot -c user.email=bot@iranamedia.github.io commit -qm "آزمایش گوینده‌ی گویا ${{ inputs.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" talking-test
