name: سهمیه‌ی ElevenLabs (تنها خواندن)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  usage:
    runs-on: ubuntu-latest
    steps:
      - name: مصرف و سهمیه
        env:
          KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          curl -sS -H "xi-api-key: $KEY" https://api.elevenlabs.io/v1/user/subscription \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps(d.get(\"detail\", d))[:400])"
