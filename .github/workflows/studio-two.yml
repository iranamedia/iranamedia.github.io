name: نقاب گوینده‌ها (برای نمای دور استودیو و رنگ لباس)
# هر بار که عکس گوینده‌ای در assets گذاشته یا دگرگون شود (مانند presenter_man_serious.jpg)،
# نقاب گوینده و نقاب لباس او با rembg ساخته و در assets ثبت می‌شود.
on:
  push:
    paths: ["assets/presenter_*.jpg"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q "rembg[cpu]" pillow numpy
      - run: python tools/make_two_shot.py out
      - name: ثبت نقاب‌ها در assets
        run: |
          cp out/presenter_*_person.png out/presenter_*_clothes.png assets/
          git add assets/presenter_*_person.png assets/presenter_*_clothes.png
          if git diff --cached --quiet; then echo "بی‌تغییر"; exit 0; fi
          git -c user.name=irana-bot -c user.email=bot@iranamedia.github.io commit -qm "نقاب گوینده‌ها"
          git pull -q --rebase && git push -q
