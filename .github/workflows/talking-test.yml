name: آزمایش گوینده‌ی گویا (منتشر نمی‌شود)
# دو تکه‌ی کوتاه از خبرنامه‌ی کنونی با چهره‌ی گویای شارلوت و بکتاش (SadTalker، روی پردازنده).
# خروجی فقط در Artifacts همین اجرا: talking-test (ویدیو + گزارش زمان). هیچ‌جا پخش نمی‌شود.
on:
  workflow_dispatch:
    inputs:
      still:
        description: "سر آرام‌تر (still)؛ خاموش = تکان بیشتر سر"
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: ابزارها (ffmpeg، قلم)
        run: |
          curl -sSfL --retry 3 -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ff.tar.xz && sudo cp ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/ && rm -rf ff.tar.xz ffmpeg-master-latest-linux64-gpl
          mkdir -p assets/fonts
          for w in Black Bold Medium; do
            curl -sSfL -o assets/fonts/Vazirmatn-$w.ttf https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-$w.ttf
          done
      - name: SadTalker
        run: |
          git clone --depth 1 https://github.com/OpenTalker/SadTalker _sad
          pip install -q torch==1.12.1+cpu torchvision==0.13.1+cpu torchaudio==0.12.1 --extra-index-url https://download.pytorch.org/whl/cpu
          grep -viE "^(gradio|torch|torchvision|torchaudio)" _sad/requirements.txt > _sad/req.txt
          pip install -q -r _sad/req.txt
          pip install -q "pillow>=9.5,<11"
          python -c "from PIL import features; print('raqm', features.check('raqm'))"
          cd _sad && bash scripts/download_models.sh && ls -la checkpoints gfpgan/weights || true
      - name: چهره‌ی گویا
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ secrets.BAKTASH_VOICE_ID || 'g8OwRTuNvpJKpiVarLb6' }}
          VOICE_ID_2: ${{ secrets.CHARLOTTE_VOICE_ID || 'XB0fDUnXU5powFXDhCwa' }}
          STILL: ${{ inputs.still && '1' || '0' }}
        run: python tools/talking_test.py _sad _talk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: talking-test
          path: |
            _talk/talking_test.mp4
            _talk/report.txt
          retention-days: 14
