name: آزمون خواندن تلگرام شهریار ایران
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          for u in "https://t.me/s/OfficialRezaPahlavi" "https://t.me/s/OfficialRezaPahlavi?before=1925"; do
            curl -sL -A "Mozilla/5.0 (IranaMedia bulletin bot)" "$u" -o p.html
            echo "== $u : $(wc -c < p.html) bytes"; grep -o 'data-post="OfficialRezaPahlavi/[0-9]*"' p.html | sort -u | tail -5
          done
          python3 - <<'PY'
          import sys; sys.path.insert(0,'tools'); import prince_tg as p
          for it in sorted(p.posts(open('p.html',encoding='utf-8').read()), key=lambda x:-x['id'])[:4]:
              print('#', it['id'], it['time'], 'photo', it['photo'], 'video', it['video']); print(it['text']); print('-----')
          PY
