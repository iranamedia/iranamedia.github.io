name: Iranamedia Hourly - Exact Intro 2585
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
  
permissions:
  contents: write
  
jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install feedparser jdatetime
      - name: Verify exact intro
        run: ls -lh assets/irana_intro_final.mp4
      - name: Build script 2585
        run: python iranamedia_final_exact_intro.py
      - name: Commit broadcast
        run: |
          git config user.name "IRANA Bot"
          git config user.email "bot@iranamedia.ir"
          git add final_broadcast/ || true
          git commit -m "Hourly 2585 $(date -u)" || echo "no changes"
          git push
