name: Iranamedia TV - Exact Intro 2585 - TV Only - REAL 5MIN (Fixes 9s placeholder + [commands] caption + Install deps timeout)
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        timeout-minutes: 8
        run: |
          pip install feedparser jdatetime requests Pillow gTTS google-api-python-client google-auth google-auth-oauthlib
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg

      - name: Verify intro (must be exact yours)
        run: |
          ls -lh assets/irana_intro_final.mp4 || ls -lh irana_intro_final.mp4 || (echo "❌ MISSING INTRO" && exit 1)
          ls -lh assets/irana_lion_gold_transparent.png || true
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 assets/irana_intro_final.mp4 || true

      - name: Build script - CLEAN caption (no [تنها صدا] commands)
        run: |
          python iranamedia_final_clean.py
          ls -lh final_broadcast/
          cat final_broadcast/caption_latest.txt || true

      - name: Build REAL 5min video (fixes 9s placeholder bug)
        timeout-minutes: 10
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          BAKTASH_VOICE_ID: ${{ secrets.BAKTASH_VOICE_ID }}
          CHARLOTTE_VOICE_ID: ${{ secrets.CHARLOTTE_VOICE_ID }}
        run: |
          python iranamedia_build_real.py
          ls -lh final_5min.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 final_5min.mp4 || true
          echo "Must be ~270s, NOT 9s"

      - name: Commit to Pages FIRST (IG needs public URL https://iranamedia.github.io/final_5min.mp4)
        run: |
          git config user.name "IRANA TV Bot"
          git config user.email "tv@iranamedia.github.io"
          mkdir -p docs/final_broadcast docs/assets
          cp assets/irana_intro_final.mp4 docs/assets/ 2>/dev/null || true
          cp assets/irana_lion_gold_transparent.png docs/assets/ 2>/dev/null || true
          cp -r final_broadcast/* docs/final_broadcast/ 2>/dev/null || true
          cp final_5min.mp4 docs/ 2>/dev/null || true
          cp final_5min.mp4 docs/final_5min.mp4 2>/dev/null || true
          git add docs/ final_broadcast/ 2>/dev/null || true
          git commit -m "TV 2585 REAL 5min + clean caption (no [commands]) - $(date -u)" || true
          git push || true

      - name: Distribute (clean caption, honest report)
        timeout-minutes: 10
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          echo "Waiting 20s for Pages to serve https://iranamedia.github.io/final_5min.mp4 for IG..."
          sleep 20
          python iranamedia_distribute_FINAL.py
