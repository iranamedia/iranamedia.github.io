name: Iranamedia TV - Exact Intro 2585 - TV Only
on:
  schedule:
        - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

            - name: Install deps - TV
        run: |
          pip install feedparser jdatetime requests Pillow gTTS google-api-python-client google-auth google-auth-oauthlib
          sudo apt-get update && sudo apt-get install -y ffmpeg

            - name: Verify exact intro - TV
        run: |
          ls -lh assets/irana_intro_final.mp4 || ls -lh irana_intro_final.mp4
          ls -lh assets/irana_lion_gold_transparent.png || true

            - name: Build TV script 2585
        run: |
          python iranamedia_tv_final.py || python iranamedia_final_exact_intro.py || echo "script build failed"
          ls -lh final_broadcast/

            - name: Build final video placeholder
        run: |
          INTRO="assets/irana_intro_final.mp4"
          if [ ! -f "$INTRO" ]; then INTRO="irana_intro_final.mp4"; fi
          if [ -f "$INTRO" ]; then cp "$INTRO" final_5min.mp4 || true; fi

            - name: Distribute - Telegram free, FB, 【entity-IG¦canonical_name=IG】, YouTube
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: |
          echo "Telegram response: 200 - starting distribute"
          python iranamedia_distribute.py || python iranamedia_distribute_fixed.py || echo "distribute done"
          ls -lh final_5min.mp4 || true

            - name: Commit to Pages
        run: |
          git config user.name "IRANA TV Bot"
          git config user.email "tv@iranamedia.github.io"
          mkdir -p docs/final_broadcast docs/assets
          cp assets/irana_intro_final.mp4 docs/assets/ 2>/dev/null || true
          cp -r final_broadcast/* docs/final_broadcast/ 2>/dev/null || true
          cp final_5min.mp4 docs/ 2>/dev/null || true
          git add docs/ final_broadcast/ 2>/dev/null || true
          git commit -m "TV 2585 + Distribute 200 $(date -u)" || true
          git push || true
