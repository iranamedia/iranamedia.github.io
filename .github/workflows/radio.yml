name: رادیو ایرانا
on:
  push:
    paths: ["bulletin/latest.json"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: radio
  cancel-in-progress: false
jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: پخش در تلگرام
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VOICE_ID: g8OwRTuNvpJKpiVarLb6
          TELEGRAM_CHANNEL: "@IranaMediaNews"
          SAVE_DIR: _site
        run: python3 radio.py
      - name: آماده‌سازی اپ ایرانا
        if: always()
        run: |
          mkdir -p _site && cp -r site/. _site/ && cp bulletin/latest.json _site/latest.json
          ls -la _site
      - uses: actions/configure-pages@v5
        if: always()
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: _site
      - name: انتشار اپ ایرانا
        if: always()
        continue-on-error: true
        uses: actions/deploy-pages@v4
