name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://claude.ai/artifact/67QZ7tHCM75ddqt6DfJLv8
          curl -sSL -A "Mozilla/5.0" -o p.html -w "code=%{http_code} type=%{content_type} url=%{url_effective}\n" $U | tee r.txt
          echo "::notice::$(cat r.txt) size=$(wc -c < p.html) start=$(grep -c BULLETIN-START p.html) stamp=$(grep -c 'class=\"stamp\"' p.html)"
          grep -oE 'https?://[a-zA-Z0-9.-]+(claudeusercontent|anthropic|claude)[a-zA-Z0-9./_?=&-]*' p.html | sort -u | head -15 | while read l; do echo "::notice::link $l"; done
          echo "::notice::head $(head -c 300 p.html | tr '\n' ' ' | tr -d '<>')"
