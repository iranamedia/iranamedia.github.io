name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          F=https://2962abe3-efdb-4a3e-81c3-b386fdd234fd.frame.claudeusercontent.com
          for path in / /index.html; do
            curl -sSL -A "Mozilla/5.0" -H "Referer: https://claude.ai/" -o p.html -w "code=%{http_code} type=%{content_type}" "$F$path" > r.txt || true
            echo "::notice::$path $(cat r.txt) size=$(wc -c < p.html) start=$(grep -c BULLETIN-START p.html) stamp=$(grep -o 'class="stamp">[^<]*' p.html | head -1)"
            echo "::notice::$path head $(head -c 400 p.html | tr '\n' ' ' | tr -d '<>')"
          done
