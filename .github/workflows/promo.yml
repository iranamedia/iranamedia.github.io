name: آگهی ایرانا
on:
  workflow_dispatch:
    inputs:
      voices:
        description: "نام:شناسه‌ی آوا، با ویرگول جدا"
        default: "sarah:EXAVITQu4vr4xnSDxMaL,charlotte:XB0fDUnXU5powFXDhCwa,lily:pFZP5JQG7iQjIQuC4Bku"
permissions:
  contents: write
jobs:
  promo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: ابزارها
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0 libfribidi0 libharfbuzz0b >/dev/null
          pip install -q --break-system-packages pillow numpy
          mkdir -p assets/fonts
          for w in Black Bold Medium; do
            curl -sSfL -o assets/fonts/Vazirmatn-$w.ttf https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-$w.ttf || curl -sSfL -o assets/fonts/Vazirmatn-$w.ttf https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@master/fonts/ttf/Vazirmatn-$w.ttf || true
          done
          ls -la assets/fonts
      - name: ساخت آگهی
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PROMO_VOICES: ${{ inputs.voices }}
        run: python3 promo.py
      - uses: actions/upload-artifact@v4
        with:
          name: irana-promo
          path: _promo/
          retention-days: 14
      - name: نگه‌داری در شاخه‌ی promo-out
        run: |
          cd _promo
          git init -q -b promo-out && git add -A
          git -c user.name="Irana" -c user.email="irana@users.noreply.github.com" commit -qm "آگهی ایرانا"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" promo-out
